#
ospf 1 router-id 10.0.2.2 
 asbr-summary 10.2.0.0 255.255.254.0
 import-route direct
 bandwidth-reference 10000
 area 0.0.0.0 
  network 10.0.2.2 0.0.0.0 
  network 10.0.24.2 0.0.0.0 
 area 0.0.0.2 
  abr-summary 10.3.0.0 255.255.254.0
  network 10.0.123.2 0.0.0.0 
