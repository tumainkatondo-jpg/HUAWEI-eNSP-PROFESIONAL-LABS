 sysname AR2
#
interface GigabitEthernet0/0/0
 ip address 10.0.123.2 255.255.255.0 
#
interface GigabitEthernet0/0/1
 ip address 10.0.24.2 255.255.255.0 

#
interface LoopBack0
 ip address 10.0.2.2 255.255.255.0 
